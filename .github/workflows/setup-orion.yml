name: 🤖 Orion AI - Build and Push

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "run" to confirm'
        required: true
        default: 'run'
      version:
        description: 'Version tag (example: 1.0.0, beta, latest)'
        required: true
        default: '1.0.0'
      push_latest:
        description: 'Also push as latest?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  build-and-push:
    if: ${{ github.event.inputs.confirm == 'run' }}
    runs-on: ubuntu-latest

    env:
      MODEL_NAME: orion
      GGUF_FILE: Mistral-7B-Instruct-v0.3-Q4_K_M.gguf

    steps:
      # =============================================
      # STEP 1: Checkout repo
      # =============================================
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      # =============================================
      # STEP 2: Show build info
      # =============================================
      - name: 📋 Build Info
        run: |
          echo "╔═══════════════════════════════════════════╗"
          echo "║           ORION AI - BUILD INFO           ║"
          echo "╚═══════════════════════════════════════════╝"
          echo ""
          echo "  Model:       ${{ env.MODEL_NAME }}"
          echo "  Version:     ${{ github.event.inputs.version }}"
          echo "  Push Latest: ${{ github.event.inputs.push_latest }}"
          echo "  Repo:        ${{ github.repository }}"
          echo "  Branch:      ${{ github.ref_name }}"
          echo ""

      # =============================================
      # STEP 3: Ensure models directory exists
      # =============================================
      - name: 📁 Prepare Models Directory
        run: mkdir -p models

      # =============================================
      # STEP 4: Cache GGUF model
      # =============================================
      - name: 💾 Cache GGUF Model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models/${{ env.GGUF_FILE }}
          key: gguf-${{ env.GGUF_FILE }}

      # =============================================
      # STEP 5: Show cache status
      # =============================================
      - name: 📊 Cache Status
        run: |
          echo "Cache hit: ${{ steps.cache-model.outputs.cache-hit }}"
          if [ -f "models/${{ env.GGUF_FILE }}" ]; then
            FILE_SIZE=$(du -sh "models/${{ env.GGUF_FILE }}" | cut -f1)
            echo "✅ Cached model found! Size: $FILE_SIZE"
          else
            echo "⬇️ No cache. Model will be downloaded."
          fi

      # =============================================
      # STEP 6: Install expect for interactive login
      # =============================================
      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y expect
          echo "✅ expect installed"

      # =============================================
      # STEP 7: Make setup script executable
      # =============================================
      - name: 🔧 Make Script Executable
        run: chmod +x scripts/setup-orion.sh

      # =============================================
      # STEP 8: Run setup script
      # =============================================
      - name: 🚀 Run Setup Script
        run: ./scripts/setup-orion.sh

      # =============================================
      # STEP 9: Verify model exists locally
      # =============================================
      - name: ✅ Verify Model Built
        run: |
          echo "Installed models:"
          ollama list
          echo ""
          if ollama list | grep -qi "^${{ env.MODEL_NAME }}"; then
            echo "✅ Model ${{ env.MODEL_NAME }} verified!"
          else
            echo "❌ Model ${{ env.MODEL_NAME }} not found!"
            exit 1
          fi

      # =============================================
      # STEP 10: Login to Ollama Registry (using expect)
      # =============================================
      - name: 🔐 Login to Ollama Registry
        env:
          OLLAMA_USER: ${{ secrets.OLLAMA_Username }}
          OLLAMA_PASS: ${{ secrets.OLLAMA_Pass }}
        run: |
          expect << 'EOF'
          set timeout 30
          spawn ollama login ollama.com
          expect {
            "Username:" {
              send "$env(OLLAMA_USER)\r"
              exp_continue
            }
            "Password:" {
              send "$env(OLLAMA_PASS)\r"
              exp_continue
            }
            "success" {
              puts "✅ Login successful!"
            }
            "Success" {
              puts "✅ Login successful!"
            }
            "logged in" {
              puts "✅ Login successful!"
            }
            "error" {
              puts "❌ Login failed!"
              exit 1
            }
            "Error" {
              puts "❌ Login failed!"
              exit 1
            }
            eof {
              puts "Login process completed"
            }
          }
          EOF

      # =============================================
      # STEP 11: Push versioned model
      # =============================================
      - name: 📤 Push Versioned Model
        env:
          USERNAME: ${{ secrets.OLLAMA_Username }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          echo "Copying model to ${USERNAME}/${{ env.MODEL_NAME }}:${VERSION}"
          ollama cp "${{ env.MODEL_NAME }}" "${USERNAME}/${{ env.MODEL_NAME }}:${VERSION}"

          echo "Pushing ${USERNAME}/${{ env.MODEL_NAME }}:${VERSION}"
          ollama push "${USERNAME}/${{ env.MODEL_NAME }}:${VERSION}"

          echo "✅ Pushed: ${USERNAME}/${{ env.MODEL_NAME }}:${VERSION}"

      # =============================================
      # STEP 12: Optionally push as latest
      # =============================================
      - name: 📤 Push Latest
        if: ${{ github.event.inputs.push_latest == 'true' }}
        env:
          USERNAME: ${{ secrets.OLLAMA_Username }}
        run: |
          echo "Copying model to ${USERNAME}/${{ env.MODEL_NAME }}:latest"
          ollama cp "${{ env.MODEL_NAME }}" "${USERNAME}/${{ env.MODEL_NAME }}:latest"

          echo "Pushing ${USERNAME}/${{ env.MODEL_NAME }}:latest"
          ollama push "${USERNAME}/${{ env.MODEL_NAME }}:latest"

          echo "✅ Pushed: ${USERNAME}/${{ env.MODEL_NAME }}:latest"

      # =============================================
      # STEP 13: Summary
      # =============================================
      - name: 🎉 Done
        env:
          USERNAME: ${{ secrets.OLLAMA_Username }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════╗"
          echo "║       🎉 ORION PUSHED SUCCESSFULLY!           ║"
          echo "╚═══════════════════════════════════════════════╝"
          echo ""
          echo "  Version:  ${VERSION}"
          echo "  Model:    https://ollama.com/${USERNAME}/${{ env.MODEL_NAME }}"
          echo ""
          echo "  Pull:"
          echo "    ollama pull ${USERNAME}/${{ env.MODEL_NAME }}:${VERSION}"
          echo ""
          echo "  Run:"
          echo "    ollama run ${USERNAME}/${{ env.MODEL_NAME }}:${VERSION}"
          echo ""

      # =============================================
      # STEP 14: GitHub Actions Summary
      # =============================================
      - name: 📝 Step Summary
        env:
          USERNAME: ${{ secrets.OLLAMA_Username }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          {
            echo "## 🤖 Orion Build Complete"
            echo ""
            echo "| Info | Value |"
            echo "|------|-------|"
            echo "| Model | ${{ env.MODEL_NAME }} |"
            echo "| Version | ${VERSION} |"
            echo "| Cache | ${{ steps.cache-model.outputs.cache-hit }} |"
            echo "| Registry | https://ollama.com/${USERNAME}/${{ env.MODEL_NAME }} |"
            echo ""
            echo "### Pull & Run"
            echo '```bash'
            echo "ollama pull ${USERNAME}/${{ env.MODEL_NAME }}:${VERSION}"
            echo "ollama run ${USERNAME}/${{ env.MODEL_NAME }}:${VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
