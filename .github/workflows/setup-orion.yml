name: 🤖 Orion AI - Build and Push

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "run" to confirm'
        required: true
        default: 'run'
      version:
        description: 'Version tag (e.g., 1.0.0, latest, beta)'
        required: true
        default: 'latest'
      push_latest:
        description: 'Also push as "latest"?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      clear_cache:
        description: 'Force re-download model?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build-and-push:
    name: Build and Push Orion v${{ github.event.inputs.version }}
    runs-on: ubuntu-latest

    env:
      MODEL_NAME: orion
      VERSION: ${{ github.event.inputs.version }}
      GGUF_FILE: Mistral-7B-Instruct-v0.3-Q4_K_M.gguf
      HF_URL: https://huggingface.co/bartowski/Mistral-7B-Instruct-v0.3-GGUF/resolve/main/Mistral-7B-Instruct-v0.3-Q4_K_M.gguf

    steps:
      # =============================================
      # STEP 1: Checkout Repository
      # =============================================
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      # =============================================
      # STEP 2: Print Build Info
      # =============================================
      - name: 📋 Build Info
        run: |
          echo "╔═══════════════════════════════════════════╗"
          echo "║           ORION AI - BUILD INFO           ║"
          echo "╚═══════════════════════════════════════════╝"
          echo ""
          echo "  Model:        ${{ env.MODEL_NAME }}"
          echo "  Version:      ${{ env.VERSION }}"
          echo "  User:         ${{ secrets.OLLAMA_Username }}"
          echo "  Push Latest:  ${{ github.event.inputs.push_latest }}"
          echo "  Clear Cache:  ${{ github.event.inputs.clear_cache }}"
          echo "  Commit:       ${{ github.sha }}"
          echo "  Branch:       ${{ github.ref_name }}"
          echo ""

      # =============================================
      # STEP 3: Cache Model File
      # =============================================
      - name: 💾 Cache Model File
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models/${{ env.GGUF_FILE }}
          key: gguf-${{ env.GGUF_FILE }}
          restore-keys: |
            gguf-

      # =============================================
      # STEP 4: Cache Ollama Data
      # =============================================
      - name: 💾 Cache Ollama Data
        id: cache-ollama
        uses: actions/cache@v4
        with:
          path: |
            ~/.ollama
            /usr/local/bin/ollama
          key: ollama-install-${{ runner.os }}
          restore-keys: |
            ollama-install-

      # =============================================
      # STEP 5: Check Cache Status
      # =============================================
      - name: 📊 Cache Status
        run: |
          echo "Model cache hit: ${{ steps.cache-model.outputs.cache-hit }}"
          echo "Ollama cache hit: ${{ steps.cache-ollama.outputs.cache-hit }}"
          
          if [ -f "models/${{ env.GGUF_FILE }}" ]; then
            FILE_SIZE=$(du -sh "models/${{ env.GGUF_FILE }}" | cut -f1)
            echo "✅ Model file found in cache! Size: $FILE_SIZE"
          else
            echo "⬇️  Model will be downloaded"
          fi

      # =============================================
      # STEP 6: Clear Cache if Requested
      # =============================================
      - name: 🗑️ Clear Cache if Requested
        if: ${{ github.event.inputs.clear_cache == 'true' }}
        run: |
          echo "Clearing cached model..."
          rm -f models/${{ env.GGUF_FILE }}
          echo "✅ Cache cleared. Model will be re-downloaded."

      # =============================================
      # STEP 7: Install Ollama
      # =============================================
      - name: 📦 Install Ollama
        if: steps.cache-ollama.outputs.cache-hit != 'true'
        run: |
          echo "Installing Ollama..."
          curl -fsSL https://ollama.com/install.sh | sh
          echo "✅ Ollama installed"

      # =============================================
      # STEP 8: Start Ollama Service
      # =============================================
      - name: ▶️ Start Ollama Service
        run: |
          ollama serve &
          sleep 5
          for i in {1..15}; do
            if curl -s http://localhost:11434 > /dev/null; then
              echo "✅ Ollama is running"
              break
            fi
            echo "Waiting for Ollama... ($i/15)"
            sleep 2
          done

      # =============================================
      # STEP 9: Download Model (if not cached)
      # =============================================
      - name: ⬇️ Download Model
        if: steps.cache-model.outputs.cache-hit != 'true' || github.event.inputs.clear_cache == 'true'
        run: |
          mkdir -p models
          echo "Downloading model from Hugging Face..."
          echo "This may take a while (~4.1GB)..."
          
          curl -L \
            --progress-bar \
            -C - \
            --retry 5 \
            --retry-delay 5 \
            -o "models/${{ env.GGUF_FILE }}" \
            "${{ env.HF_URL }}"
          
          FILE_SIZE=$(du -sh "models/${{ env.GGUF_FILE }}" | cut -f1)
          echo "✅ Download complete! Size: $FILE_SIZE"

      # =============================================
      # STEP 10: Skip Download (if cached)
      # =============================================
      - name: ⚡ Using Cached Model
        if: steps.cache-model.outputs.cache-hit == 'true' && github.event.inputs.clear_cache != 'true'
        run: |
          FILE_SIZE=$(du -sh "models/${{ env.GGUF_FILE }}" | cut -f1)
          echo "⚡ Using cached model! Size: $FILE_SIZE"
          echo "⏱️  Saved ~10 minutes of download time"

      # =============================================
      # STEP 11: Build Model in Ollama
      # =============================================
      - name: 🏗️ Build Orion in Ollama
        run: |
          echo "Building Orion from Modelfile..."
          
          # Create temp modelfile with absolute path
          GGUF_PATH="$(pwd)/models/${{ env.GGUF_FILE }}"
          TEMP_MODELFILE=$(mktemp /tmp/Modelfile.XXXXXX)
          
          sed "s|FROM .*|FROM $GGUF_PATH|g" Modelfile > "$TEMP_MODELFILE"
          
          echo "--- Modelfile Contents ---"
          cat "$TEMP_MODELFILE"
          echo "--- End Modelfile ---"
          echo ""
          
          ollama create ${{ env.MODEL_NAME }} -f "$TEMP_MODELFILE"
          
          rm -f "$TEMP_MODELFILE"
          
          echo "✅ Orion model built!"

      # =============================================
      # STEP 12: Verify Model Built
      # =============================================
      - name: ✅ Verify Model Built
        run: |
          echo "Listing all models:"
          ollama list
          echo ""
          
          if ollama list | grep -q "${{ env.MODEL_NAME }}"; then
            echo "✅ Orion model verified!"
          else
            echo "❌ Model not found!"
            exit 1
          fi

      # =============================================
      # STEP 13: Login to Ollama Registry
      # =============================================
      - name: 🔐 Login to Ollama Registry
        run: |
          echo "${{ secrets.API_OLLAMA }}" | ollama login \
            --username "${{ secrets.OLLAMA_Username }}" \
            --password-stdin ollama.com

      # =============================================
      # STEP 14: Push Versioned Model
      # =============================================
      - name: 📤 Push Orion v${{ env.VERSION }}
        run: |
          echo "Tagging with version: ${{ env.VERSION }}"
          
          ollama cp ${{ env.MODEL_NAME }} \
            ${{ secrets.OLLAMA_Username }}/${{ env.MODEL_NAME }}:${{ env.VERSION }}
          
          ollama push \
            ${{ secrets.OLLAMA_Username }}/${{ env.MODEL_NAME }}:${{ env.VERSION }}
          
          echo "✅ Pushed: ${{ secrets.OLLAMA_Username }}/${{ env.MODEL_NAME }}:${{ env.VERSION }}"

      # =============================================
      # STEP 15: Push as Latest (if selected)
      # =============================================
      - name: 📤 Push as Latest
        if: ${{ github.event.inputs.push_latest == 'true' }}
        run: |
          echo "Also pushing as latest..."
          
          ollama cp ${{ env.MODEL_NAME }} \
            ${{ secrets.OLLAMA_Username }}/${{ env.MODEL_NAME }}:latest
          
          ollama push \
            ${{ secrets.OLLAMA_Username }}/${{ env.MODEL_NAME }}:latest
          
          echo "✅ Pushed: ${{ secrets.OLLAMA_Username }}/${{ env.MODEL_NAME }}:latest"

      # =============================================
      # STEP 16: Create Git Tag
      # =============================================
      - name: 🏷️ Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag -a "v${{ env.VERSION }}" \
            -m "Orion v${{ env.VERSION }} - Built and pushed to Ollama" || true
          git push origin "v${{ env.VERSION }}" || echo "Tag already exists, skipping..."

      # =============================================
      # STEP 17: Build Summary
      # =============================================
      - name: 🎉 Done
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════╗"
          echo "║       🎉 ORION PUSHED SUCCESSFULLY!           ║"
          echo "╠═══════════════════════════════════════════════╣"
          echo "║                                               ║"
          echo "║  Version:  ${{ env.VERSION }}                         ║"
          echo "║  Git Tag:  v${{ env.VERSION }}                        ║"
          echo "║  Cache:    ${{ steps.cache-model.outputs.cache-hit }}                        ║"
          echo "║                                               ║"
          echo "╚═══════════════════════════════════════════════╝"
          echo ""
          echo "  Your model is live at:"
          echo "    https://ollama.com/${{ secrets.OLLAMA_Username }}/${{ env.MODEL_NAME }}"
          echo ""
          echo "  Pull specific version:"
          echo "    ollama pull ${{ secrets.OLLAMA_Username }}/${{ env.MODEL_NAME }}:${{ env.VERSION }}"
          echo ""
          echo "  Pull latest:"
          echo "    ollama pull ${{ secrets.OLLAMA_Username }}/${{ env.MODEL_NAME }}:latest"
          echo ""
          echo "  Run it:"
          echo "    ollama run ${{ secrets.OLLAMA_Username }}/${{ env.MODEL_NAME }}:${{ env.VERSION }}"
          echo ""
